name: Publish Windows SDK

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/publish-windows-sdk.yml
  workflow_dispatch:

jobs:
  windows-x64-static-crt:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $full = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($full -notmatch '^(\d+\.\d+\.\d+)\.\d+$') {
            throw "Unexpected VERSION: $full"
          }
          $base = $Matches[1]
          $tag = "v$base-cdd.1"
          $asset = "core-ui-$tag-windows-x64.zip"
          "base=$base" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "asset=$asset" >> $env:GITHUB_OUTPUT

      - name: Configure static CRT build
        shell: pwsh
        run: |
          cmake -S . -B build-release -A x64 `
            -DUI_CORE_MSVC_STATIC_CRT=ON `
            -DUI_CORE_BUILD_STATIC_ARCHIVE=OFF `
            -DUI_CORE_BUILD_INTERNAL_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed.' }

      - name: Build core-ui
        shell: pwsh
        run: |
          cmake --build build-release --config Release --target core-ui --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Core UI build failed.' }

      - name: Verify no dynamic MSVC runtime dependency
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio installation not found.' }
          $dumpbin = Get-ChildItem -LiteralPath (Join-Path $vs 'VC\Tools\MSVC') -Filter dumpbin.exe -Recurse |
            Where-Object { $_.FullName -match '\\Hostx64\\x64\\dumpbin\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { throw 'dumpbin.exe not found.' }
          $dll = 'build-release\Release\core-ui.dll'
          $deps = (& $dumpbin /dependents $dll 2>&1) -join "`n"
          Write-Host $deps
          if ($deps -match 'MSVCP140(?:_[0-9]+)?\.dll|VCRUNTIME140(?:_[0-9]+)?\.dll|CONCRT140\.dll') {
            throw 'core-ui.dll still imports a dynamic MSVC runtime DLL.'
          }

      - name: Package SDK
        id: package
        shell: pwsh
        run: |
          $base = '${{ steps.version.outputs.base }}'
          $asset = '${{ steps.version.outputs.asset }}'
          $root = Join-Path $env:RUNNER_TEMP "core-ui-v$base"
          $include = Join-Path $root 'include'
          $dynamic = Join-Path $root 'lib\dynamic'
          New-Item -ItemType Directory -Force -Path $include, $dynamic | Out-Null

          Copy-Item -LiteralPath 'include\ui_core.h' -Destination $include
          Copy-Item -LiteralPath 'build-release\Release\core-ui.dll' -Destination $dynamic
          Copy-Item -LiteralPath 'build-release\Release\core-ui.lib' -Destination $dynamic
          Copy-Item -LiteralPath 'LICENSE' -Destination $root
          Copy-Item -LiteralPath 'README.md' -Destination $root
          Copy-Item -LiteralPath 'CHANGELOG.md' -Destination $root

          $archive = Join-Path $env:GITHUB_WORKSPACE $asset
          Compress-Archive -LiteralPath $root -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$archive.sha256", "$hash  $asset`n", [Text.UTF8Encoding]::new($false))
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: core-ui-windows-x64-static-crt
          path: |
            ${{ steps.version.outputs.asset }}
            ${{ steps.version.outputs.asset }}.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $asset = '${{ steps.version.outputs.asset }}'
          $sha256 = '${{ steps.package.outputs.sha256 }}'
          $notes = @"
          Windows x64 SDK for Core UI ${{ steps.version.outputs.base }} (fork build).

          - Core UI build: $(Get-Content -LiteralPath VERSION -Raw)
          - MSVC runtime: statically linked (/MT)
          - No dependency on MSVCP140.dll, VCRUNTIME140*.dll, or CONCRT140.dll
          - Intended for portable downstream applications such as San9 Toolkit
          - SHA-256: $sha256
          "@

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset "$asset.sha256" --clobber
            gh release edit $tag --title "Core UI $tag Windows SDK" --notes $notes
          } else {
            gh release create $tag $asset "$asset.sha256" `
              --target $env:GITHUB_SHA `
              --title "Core UI $tag Windows SDK" `
              --notes $notes
          }
